# Runs the reconciliation + expectation suite before promoting data to gold.
trigger: none

pool: {vmImage: ubuntu-latest}

steps:
  - task: UsePythonVersion@0
    inputs: {versionSpec: '3.10'}
  - script: pip install -r requirements.txt
    displayName: Install deps
  - script: python scripts/run_local.py
    displayName: Run validation gate
  - template: templates/run-pytest.yml